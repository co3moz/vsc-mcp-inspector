name: Build VSIX

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      file: ${{ steps.package.outputs.file }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version. Bump the version before tagging."
            exit 1
          fi

      - name: Type-check
        run: npm run check

      - name: Core tests (stdio, SSE, Streamable HTTP)
        run: npm run test:core

      - name: Package VSIX
        id: package
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            file="vsc-mcp-inspector-${version}.vsix"
          else
            file="vsc-mcp-inspector-${version}-${GITHUB_SHA::7}.vsix"
          fi
          npx vsce package --no-dependencies --out "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.file }}
          archive: false
          if-no-files-found: error

  integration:
    name: integration (VS Code ${{ matrix.vscode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported version (engines.vscode in package.json) and the current release.
        vscode: ['1.90.0', stable]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Integration tests
        run: xvfb-run -a npm run test:integration
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.file }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ needs.build.outputs.file }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$FILE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "$FILE" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi

  marketplace:
    # Publishes the tested VSIX to the Visual Studio Marketplace. Authentication, first match wins:
    #   1. Microsoft Entra ID (recommended): repository variables AZURE_CLIENT_ID and AZURE_TENANT_ID
    #      of an app registration with a federated credential for the "marketplace" environment.
    #      No secret is stored; the app is a Contributor member of the publisher.
    #   2. VSCE_PAT secret: an Azure DevOps PAT. Global PATs stop working on 2026-12-01.
    # Marketplace trusted publishing (vsce publish --oidc) is not available on the Marketplace yet.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: marketplace
      url: https://marketplace.visualstudio.com/items?itemName=co3moz.vsc-mcp-inspector
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.file }}

      - name: Sign in to Microsoft Entra ID
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Show the Marketplace identity
        if: vars.AZURE_CLIENT_ID != ''
        run: |
          # 499b84ac-... is the Azure DevOps / Marketplace resource.
          id=$(az rest --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv \
            -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me)
          echo "Marketplace identity ID: $id"
          echo "::notice title=Marketplace identity::$id (add it as a Contributor member of the co3moz publisher)"

      - name: Publish to the Visual Studio Marketplace
        env:
          FILE: ${{ needs.build.outputs.file }}
          USE_ENTRA: ${{ vars.AZURE_CLIENT_ID != '' }}
          PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ "$USE_ENTRA" = "true" ]; then
            npx vsce publish --azure-credential --packagePath "$FILE" --skip-duplicate
          elif [ -n "$PAT" ]; then
            VSCE_PAT="$PAT" npx vsce publish --packagePath "$FILE" --skip-duplicate
          else
            echo "::error::No Marketplace credentials: set the AZURE_CLIENT_ID and AZURE_TENANT_ID repository variables (Microsoft Entra ID) or the VSCE_PAT secret. See README > Marketplace publishing setup."
            exit 1
          fi

  openvsx:
    # Publishes the tested VSIX to Open VSX (VSCodium, Cursor, Windsurf, Gitpod, ...).
    # Uses the OVSX_PAT secret and creates the namespace (package.json "publisher") on the first
    # publish. Without OVSX_PAT, ovsx falls back to Open VSX trusted publishing (OIDC), which can be
    # registered for this workflow once the extension exists.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: openvsx
      url: https://open-vsx.org/extension/co3moz/vsc-mcp-inspector
    permissions:
      contents: read
      id-token: write
    env:
      OVSX: npx --yes ovsx@1.2.0
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.file }}

      - name: Publish to Open VSX
        env:
          FILE: ${{ needs.build.outputs.file }}
          PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$PAT" ]; then
            export OVSX_PAT="$PAT"
            namespace=$(unzip -p "$FILE" extension/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).publisher")
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "https://open-vsx.org/api/$namespace")" = "404" ]; then
              echo "Creating Open VSX namespace $namespace"
              $OVSX create-namespace "$namespace"
            fi
          else
            echo "::notice::OVSX_PAT is not set; publishing with Open VSX trusted publishing."
          fi
          $OVSX publish "$FILE" --skip-duplicate
