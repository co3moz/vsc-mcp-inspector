name: Build VSIX

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Core tests (stdio, SSE, Streamable HTTP)
        run: npm run test:core

      - name: Package VSIX
        id: package
        run: |
          version=$(node -p "require('./package.json').version")
          file="vsc-mcp-inspector-${version}-${GITHUB_SHA::7}.vsix"
          npx vsce package --no-dependencies --skip-license --allow-missing-repository --out "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.file }}
          archive: false
          if-no-files-found: error
